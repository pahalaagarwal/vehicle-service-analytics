{% extends "base.html" %}

{% block title %}Register Account — AutoCare Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-person-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Create Account</h3>
                    <p class="text-muted small">Join the vehicle analytics and service management platform</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Create strong password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">System Role</label>
                        <select name="role" class="form-select" required>
                            <option value="service_advisor">Service Advisor (Can log services & run predictions)</option>
                            <option value="admin">Administrator (Full CRUD & data delete privileges)</option>
                            <option value="customer">Customer (View-only profile & reminders)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3">
                        <i class="bi bi-check2-circle me-1"></i> Complete Registration
                    </button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="{{ url_for('login') }}" class="small fw-semibold text-decoration-none ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
