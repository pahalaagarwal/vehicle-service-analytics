{% extends "base.html" %}

{% block title %}Book / Log Service Ticket — AutoCare Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="d-flex align-items-center mb-3">
            <a href="{{ url_for('services_list') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <h3 class="fw-bold mb-0">Log Service Ticket</h3>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Vehicle <span class="text-danger">*</span></label>
                        <select name="vehicle_id" class="form-select" required>
                            <option value="">Select vehicle...</option>
                            {% for v in vehicles %}
                            <option value="{{ v.vehicle_id }}" {% if request.args.get('vehicle_id')|int == v.vehicle_id %}selected{% endif %}>
                                {{ v.registration_no }} — {{ v.make }} {{ v.model }} (Owner: {{ v.customer_name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Service Date <span class="text-danger">*</span></label>
                            <input type="date" name="service_date" class="form-control" value="{{ service.service_date or '' }}" required id="serviceDateInput">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Service Type <span class="text-danger">*</span></label>
                            <select name="service_type" class="form-select" required>
                                <option value="Routine">Routine Scheduled Maintenance</option>
                                <option value="Major Repair">Major Mechanical / Electrical Repair</option>
                                <option value="Emergency Breakdown">Emergency Roadside Breakdown</option>
                                <option value="Inspection">Safety & Diagnostic Inspection</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Odometer Reading (km) <span class="text-danger">*</span></label>
                            <input type="number" name="mileage" class="form-control" min="0" placeholder="e.g. 85000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Labour Cost ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="labour_cost" class="form-control" placeholder="e.g. 150.00" value="120.00" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Status</label>
                        <select name="status" class="form-select">
                            <option value="Completed" selected>Completed</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Scheduled">Scheduled</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Technician Notes & Diagnostics</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Oil change, brake inspection notes, filter replacements, customer complaints..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('services_list') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2 me-1"></i> Save Ticket & Attach Parts
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Default to today's date if empty
if (!document.getElementById('serviceDateInput').value) {
    document.getElementById('serviceDateInput').value = new Date().toISOString().split('T')[0];
}
</script>
{% endblock %}
